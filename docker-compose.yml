version: '3.8'

services:
  api:
    build:
      context: .
      args:
        APP_ENV: development
    ports:
      - "8001:8000"
    volumes:
      - ./src:/app/src
      - ./tests:/app/tests
    environment:
      - PYTHONPATH=/app
      - DATABASE_URL=postgresql://user:password@postgres/kc-booth-db
      - STEP_PROVISIONER_PASSWORD=password # In a real app, use a secret
    depends_on:
      - postgres
      - step-ca

  postgres:
    image: postgres:13
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    environment:
      - POSTGRES_USER=user
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=kc-booth-db

  step-ca:
    image: smallstep/step-ca
    ports:
      - "9000:9000"
    environment:
      - DOCKER_STEPCA_INIT_NAME=kc-booth-ca
      - DOCKER_STEPCA_INIT_DNS=step-ca,localhost
      - DOCKER_STEPCA_INIT_ADDRESS=:9000
      - DOCKER_STEPCA_INIT_PROVISIONER=admin
      - DOCKER_STEPCA_INIT_PROVISIONER_PASSWORD=password # In a real app, use a secret
    volumes:
      - step-ca-data:/home/step
    command:
      - "step-ca"
      - "/home/step/config/ca.json"

  test:
    build:
      context: .
      args:
        APP_ENV: development
    volumes:
      - ./src:/app/src
      - ./tests:/app/tests
    environment:
      - PYTHONPATH=/app
      - DATABASE_URL=postgresql://user:password@postgres/kc-booth-db
    depends_on:
      - postgres
    command: pytest

volumes:
  postgres_data:
  step-ca-data:
